<header><h1>Korona</h1><span class="tag" id="tagline"></span></header>
<main>
  <div id="wrap"><div class="boardShell"><canvas id="game" width="900" height="900" aria-label="Korona board"></canvas></div></div>
  <aside>
    <div class="status">
      <div class="turn" id="turnText"></div>
      <div id="help"></div>
      <div class="score" id="scoreBox"></div>
      <div id="winText" style="font-weight:800;color:#ffe69a"></div>
    </div>
    <div class="row"><button id="newBtn"></button><button id="undoBtn"></button></div>
    <div class="row">
      <select id="players"><option value="2">2 players</option><option value="3">3 players</option><option value="4">4 players</option></select>
      <select id="variant"><option value="rows">Finnish row setup</option><option value="center">Center-circle Couronne setup</option></select>
      <button id="applyVariant"></button>
    </div>
    <div class="row">
      <select id="language"><option value="en">English</option><option value="fi">Suomi</option><option value="sv">Svenska</option></select>
      <select id="scheme"><option value="wood">Classic wood</option><option value="finnish">Finnish blue & white</option><option value="walnut">Dark walnut</option><option value="german" hidden>German red</option></select>
    </div>
    <div class="botGrid" id="botControls"></div>
    <div class="row"><button id="botBtn"></button><button id="speedBtn"></button><button id="soundBtn"></button><button id="musicBtn"></button></div>
    <p class="small" id="controls"></p>
    <p class="small" id="credit"></p>
    <details><summary id="rulesSummary"></summary><ul id="rulesList"></ul></details>
    <details><summary id="logSummary"></summary><div class="log" id="log"></div></details>

let audioCtx=null, audioUnlocked=false, masterGain=null, fxGain=null, musicGain=null, musicFilter=null, limiter=null;
function getAudioCtx(){
 if(!audioCtx){
   const AC=window.AudioContext||window.webkitAudioContext;
   if(!AC) return null;
   audioCtx=new AC();

   masterGain=audioCtx.createGain();
   masterGain.gain.value=1.35;

   limiter=audioCtx.createDynamicsCompressor();
   limiter.threshold.value=-7;
   limiter.knee.value=18;
   limiter.ratio.value=7;
   limiter.attack.value=.004;
   limiter.release.value=.18;

   fxGain=audioCtx.createGain();
   fxGain.gain.value=2.25;

   musicGain=audioCtx.createGain();
   musicGain.gain.value=1.15;

   musicFilter=audioCtx.createBiquadFilter();
   musicFilter.type='lowpass';
   musicFilter.frequency.value=4200;
   musicFilter.Q.value=.55;

   fxGain.connect(limiter);
   musicGain.connect(musicFilter);
   musicFilter.connect(limiter);
   limiter.connect(masterGain);
   masterGain.connect(audioCtx.destination);
 }
 return audioCtx;
}
function unlockAudio(){
 if(!sound && !themeMusic) return;
 const ac=getAudioCtx();

   if(ac.state==='suspended') ac.resume();

 }catch(e){}
}
let lastBeepAt=0;
function beep(freq=360,dur=.055,vol=.46){
 if(!sound) return;
 try{
   const ac=getAudioCtx();
   if(!ac) return;
   if(ac.state==='suspended') ac.resume();

   // Prevent rapid collision spam from becoming a broken/rattling buzz.
   const now=ac.currentTime;
   if(now-lastBeepAt<.012) return;
   lastBeepAt=now;

   const o=ac.createOscillator(), g=ac.createGain(), f=ac.createBiquadFilter();
   o.type='sine';
   f.type='lowpass';
   f.frequency.setValueAtTime(Math.min(3200,Math.max(500,freq*5)),now);
   o.frequency.setValueAtTime(freq,now);

   const v=Math.min(.95,Math.max(.001,vol));
   g.gain.setValueAtTime(.0001,now);
   g.gain.linearRampToValueAtTime(v,now+.006);
   g.gain.exponentialRampToValueAtTime(.0001, now+dur);

   o.connect(f);
   f.connect(g);
   g.connect(fxGain||ac.destination);
   o.start(now);
   o.stop(now+dur+.02);
 }catch(e){}
}

function scheduleThemeOnce(){

   g.gain.exponentialRampToValueAtTime(.0001,t1);

   sub.gain.value=isSide?.22:.30;

   o2.connect(sub);
   sub.connect(f);
   f.connect(g);

function drawJoulutorttu(cx,cy,size){
 ctx.save();

 // Exact geometry for the windwheel / joulutorttu.

 const L = D;                    // leg length of each 90° triangle
 const C = Math.round(D * 0.30); // central overlap offset
 const pal = scheme();
 const board = pal.symbolCutout || pal.board;
 const dark = pal.symbol;

 // Diamond base: outline only, same color as the blades.
 ctx.beginPath();
 ctx.moveTo(0,-D);
 ctx.lineTo(D,0);
 ctx.lineTo(0,D);
 ctx.lineTo(-D,0);
 ctx.closePath();
 ctx.strokeStyle = dark;
 ctx.lineWidth = 5;
 ctx.stroke();

 // Four overlapping fully opaque 90-degree triangles.
 const tris = [
   [[0,-D],[L,-D],[0,C]],   // top blade
   [[D,0],[D,L],[-C,0]],    // right blade
   [[0,D],[-L,D],[0,-C]],   // bottom blade
   [[-D,0],[-D,-L],[C,0]]   // left blade
 ];

 ctx.fillStyle = dark;
 ctx.strokeStyle = dark;
 ctx.lineWidth = 2;
 for(const tri of tris){
   ctx.beginPath();
   ctx.moveTo(tri[0][0], tri[0][1]);
   ctx.lineTo(tri[1][0], tri[1][1]);
   ctx.lineTo(tri[2][0], tri[2][1]);
   ctx.closePath();
   ctx.fill();
   ctx.stroke();
 }

 // Small center cutout.
 ctx.beginPath();
 ctx.moveTo(0,-C*0.32);
 ctx.lineTo(C*0.32,0);
 ctx.lineTo(0,C*0.32);
 ctx.lineTo(-C*0.32,0);

function drawJoulutorttuRotatedAroundBoardCenter(cx,cy,size,angle){
 const pal=scheme();
 const board = pal.symbolCutout || pal.board;
 const dark = pal.symbol;
 const D = Math.min(size, 62);
 const L = D;
 const C = Math.round(D * 0.30);

   return {x:cx + x*ca - y*sa, y:cy + x*sa + y*ca};
 }

   ctx.beginPath();
   points.forEach((q,i)=>{
     const p=pt(q[0],q[1]);
     if(i===0) ctx.moveTo(p.x,p.y);
     else ctx.lineTo(p.x,p.y);
   });
   ctx.closePath();
   if(fill){ ctx.fillStyle=fill; ctx.fill(); }
   if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=lineWidth||2; ctx.stroke(); }
 }

 // All coordinates below are local to the board center / diamond center.
 // The rotation is applied to every vertex around (cx,cy), not per-shape.
 pathPoly([[0,-D],[D,0],[0,D],[-D,0]], null, dark, 5);

 const tris=[
   [[0,-D],[L,-D],[0,C]],
   [[D,0],[D,L],[-C,0]],
   [[0,D],[-L,D],[0,-C]],
   [[-D,0],[-D,-L],[C,0]]
 ];
 for(const tri of tris) pathPoly(tri, dark, dark, 2);

 pathPoly([[0,-C*.32],[C*.32,0],[0,C*.32],[-C*.32,0]], board, null, 0);
}

function drawTrasselSpiral(cx,cy,size){
 ctx.save();
 ctx.translate(cx,cy);
 if(spiralSpin) ctx.rotate(spiralAngle);
 // Box-accurate hidden spiral.
 // We model the symbol on a 5x5 cell grid whose extreme occupied corners are
 // at (+/-2.5u, +/-2.5u). To fit tightly inside the middle guide circle,
 // choose u so 2.5u*sqrt(2) stays just under size.
 const radius = Math.min(size, 96) - 2;
 const unit = radius / (2.5 * Math.SQRT2);
 const dark = scheme().symbol;
 ctx.fillStyle = dark;

 function boxCells(x,y,w,h){
   ctx.fillRect((x-0.5)*unit, (y-0.5)*unit, w*unit, h*unit);
 }

 // Middle cross: two 5x1 boxes overlapping in the central 1x1 square.
 boxCells(-2, 0, 5, 1); // horizontal 5x1: x=-2..2 at y=0
 boxCells(0, -2, 1, 5); // vertical   5x1: y=-2..2 at x=0

 // Four 3x1 boxes, each overlapping its corresponding cross arm by exactly one 1x1 cell.
 boxCells(0, -2, 3, 1);  // top arm points right; overlap cell is (0,-2)
 boxCells(2, 0, 1, 3);   // right arm points down; overlap cell is (2,0)
 boxCells(-2, 2, 3, 1);  // bottom arm points left; overlap cell is (0,2)
 boxCells(-2, -2, 1, 3); // left arm points up; overlap cell is (-2,0)

 ctx.restore();
}

function drawAimGuide(){

       ctx.beginPath();
       ctx.arc(hitX,hitY,6,0,Math.PI*2);

function impossibleAiCandidates(limit=38){

 let cands=[];

   }

function cloneForAi(){

function simulateAiShot(cand,power){

 const dx=cand.aim.x-cand.start.x, dy=cand.aim.y-cand.start.y, d=Math.hypot(dx,dy)||1;
 s.vx=dx/d*power; s.vy=dy/d*power;
 let active=arr.concat([s]), own=0, opp=0, strikerPocket=false, steps=0;
 for(;steps<520;steps++){
   let any=false;
   for(const b of active){
     if(b.pocketed) continue;
     b.x+=b.vx; b.y+=b.vy; b.vx*=FRICTION; b.vy*=FRICTION;

   }
   for(let k=0;k<2;k++) for(let i=0;i<active.length;i++) for(let j=i+1;j<active.length;j++){
     if(!active[i].pocketed&&!active[j].pocketed) simCollide(active[i],active[j]);
   }
   for(const b of active){
     if(b.pocketed) continue;
     for(const p of pockets){

   }

 // The higher own-disc reward makes stronger shots worthwhile instead of timid.
 let score=own*8500-opp*3200-steps*.35;

function botChooseShotImpossible(){
 const candidates=impossibleAiCandidates(38);
 // Smart stronger search:
 // 1) broad analytic candidate ranking
 // 2) coarse physics on all selected candidates
 // 3) refine only best tactical lines
 const coarsePowers=[0.82,0.96,1.10,1.25,1.42];
 const coarseAim=[0,-0.028,0.028,-0.055,0.055];
 const scored=[];
 let tested=0;

 function testShot(cand,powerMult,angleOffset){
   const d=dist(cand.start.x,cand.start.y,cand.aim.x,cand.aim.y);
   const basePower=clamp(d*.108+8.8,11.0,29.0);
   const dir=Math.atan2(cand.aim.y-cand.start.y,cand.aim.x-cand.start.x);
   const range=dist(cand.start.x,cand.start.y,cand.aim.x,cand.aim.y);
   const aim={x:cand.start.x+Math.cos(dir+angleOffset)*range,y:cand.start.y+Math.sin(dir+angleOffset)*range};
   const power=basePower*powerMult;
   const sim=simulateAiShot({...cand,aim},power);
   let score=sim.score+cand.base*.16;
   if(cand.type==='direct' && sim.own>0 && sim.opp===0 && !sim.strikerPocket) score += 6500 + sim.own*2300;
   if(cand.type==='force' && sim.own===0 && !sim.strikerPocket) score += 650;
   if(sim.own>=2 && sim.opp===0 && !sim.strikerPocket) score += 5200;
   if(sim.own>0 && sim.opp===0 && !sim.strikerPocket) score += 1800; // extra value for keeping turn
   if(sim.strikerPocket || (sim.own>0&&sim.opp>0)) score -= 12500;
   tested++;
   return {start:cand.start,aim,power,score,sim,wobble:0,tested};
 }

 for(const cand of candidates){
   for(const pm of coarsePowers){
     for(const ao of coarseAim){
       scored.push(testShot(cand,pm,ao));
     }
   }
 }
 scored.sort((a,b)=>b.score-a.score);

 const refinePowers=[0.94,1.00,1.06,1.14,1.24,1.36,1.50];
 const refineAim=[0,-0.012,0.012,-0.026,0.026,-0.040,0.040];
 let best=scored[0]||null;

 for(const seed of refineSeeds){
   const cand={start:seed.start,aim:seed.aim,base:seed.score*.025,type:'refine'};
   for(const pm of refinePowers){
     for(const ao of refineAim){
       const trial=testShot(cand,pm,ao);
       if(!best||trial.score>best.score) best=trial;
     }
   }
 }
 if(best) return best;
 return botChooseShotHard();
}

function startBotHumanLikeTurn(){

}
function updateAiActing(elapsed){

   aiActing.placeT=Math.min(1, aiActing.placeT + elapsed/aiActing.placeMs);
   const t=aiActing.placeT;
   const ease=t<1?1-Math.pow(1-t,2):1;
   striker.x=aiActing.fromX + (aiActing.startX-aiActing.fromX)*ease;
   striker.y=aiActing.fromY + (aiActing.startY-aiActing.fromY)*ease;
   dragging=false; dragFrom=null; dragNow=null;
   if(t>=1){
     striker.x=aiActing.startX; striker.y=aiActing.startY;
     aiActing.phase='aiming';
   }
   return;
 }
 if(aiActing.phase==='aiming'){
   aiActing.aimT=Math.min(1, aiActing.aimT + elapsed/aiActing.aimMs);
   const t=aiActing.aimT;
   const ease=Math.sin(t*Math.PI*.5);
   dragging=true;
   dragFrom={x:striker.x,y:striker.y};
   dragNow={x:striker.x-aiActing.pullX*ease,y:striker.y-aiActing.pullY*ease};
   if(t>=1){
     aiActing.phase='holding';
     aiActing.waitT=0;
   }
   return;
 }
 if(aiActing.phase==='holding'){
   dragging=true;
   dragFrom={x:striker.x,y:striker.y};
   dragNow={x:striker.x-aiActing.pullX,y:striker.y-aiActing.pullY};
   aiActing.waitT += elapsed;
   if(aiActing.waitT>=aiActing.holdMs){
     lastSnapshot=cloneState(); shotEvents={potted:[],strikerPocket:false};
     dragging=false; dragFrom=null; dragNow=null;
     striker.vx=aiActing.shotVX; striker.vy=aiActing.shotVY;
     physicsAccumulator=0; lastFrameTime=null; moving=true; aiActing=null;
   }
 }
}
function botShoot(){ startBotHumanLikeTurn(); }

function loop(now){

function pos(e){ const rect=canvas.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:(t.clientX-rect.left)*W/rect.width,y:(t.clientY-rect.top)*H/rect.height};}
function linePlacement(p){ const l=shootingLine(current); if(l.axis==='y') return {ok:Math.abs(p.y-l.value)<55,x:p.x,y:l.value,key:p.x}; return {ok:Math.abs(p.x-l.value)<55,x:l.value,y:p.y,key:p.y};}
canvas.addEventListener('pointerdown',e=>{ unlockAudio(); const p=pos(e); if(!moving&&dist(p.x,p.y,W/2,H/2)<=112){ triggerCenterSecret(); return; } if(moving||won||isComputerTurn())return; if(striker&&dist(p.x,p.y,striker.x,striker.y)<striker.r+12){ dragging=true; dragFrom={x:striker.x,y:striker.y}; dragNow=p; canvas.setPointerCapture(e.pointerId); } else { const lp=linePlacement(p); if(lp.ok){ const line=shootingLine(current); const safe=safeStrikerLinePos(line,lp.key); striker.x=safe.x; striker.y=safe.y; } } });
canvas.addEventListener('pointermove',e=>{ if(dragging) dragNow=pos(e); });
canvas.addEventListener('pointerup',e=>{ if(!dragging||moving||won||isComputerTurn())return; const p=pos(e); dragging=false; const vx=(dragFrom.x-p.x), vy=(dragFrom.y-p.y), power=Math.min(165,Math.hypot(vx,vy)); if(power<8) return; lastSnapshot=cloneState(); shotEvents={potted:[],strikerPocket:false}; striker.vx=vx*.125; striker.vy=vy*.125; physicsAccumulator=0; lastFrameTime=null; moving=true; });
window.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='r'&&!moving&&!won&&!isComputerTurn()){
   // Cancel only the loaded/pulled strike. Keep the striker exactly where it is.
   dragging=false;
   dragFrom=null;
   dragNow=null;
   if(striker){ striker.vx=0; striker.vy=0; }
 }
});
function syncControls(){
 document.getElementById('variant').value=variant;
 document.getElementById('players').value=String(playerCount);
 document.getElementById('language').value=lang;
 const sc=document.getElementById('scheme');
 if(sc&&sc.options[3]) sc.options[3].hidden=!germanUnlocked;
 if(boardScheme==='german'&&!germanUnlocked) boardScheme='wood';
 if(sc) sc.value=boardScheme;
}
document.getElementById('newBtn').onclick=resetGame; document.getElementById('undoBtn').onclick=()=>{restoreState(lastSnapshot); lastSnapshot=null; log(lang==='fi'?'Lyönti kumottu.':lang==='sv'?'Slaget ångrades.':'Undid last shot.');};
document.getElementById('applyVariant').onclick=()=>{variant=document.getElementById('variant').value; playerCount=Number(document.getElementById('players').value); resetGame();};
document.getElementById('language').onchange=e=>{lang=e.target.value; syncControls(); updateText();};
document.getElementById('scheme').onchange=e=>{boardScheme=(e.target.value==='german'&&!germanUnlocked)?'wood':e.target.value; applyPageTheme(); syncControls(); updateText(); updateUI();};
document.getElementById('players').onchange=e=>{playerCount=Number(e.target.value); players=playerOrders[playerCount]; botPending=false; updateText();};
document.getElementById('variant').onchange=e=>{variant=e.target.value;};
document.getElementById('botBtn').onclick=()=>{aimHelper=!aimHelper; updateText();};
document.getElementById('speedBtn').onclick=()=>{gameSpeed=gameSpeed===1?2:(gameSpeed===2?4:1); updateText();};
document.getElementById('soundBtn').onclick=()=>{sound=!sound; if(sound) unlockAudio(); updateText();};
document.getElementById('musicBtn').onclick=toggleThemeMusic;


function unlockGermanScheme(){
 if(germanUnlocked) return;
 germanUnlocked=true;
 boardRainbow=false;
 boardScheme='german';
 syncControls();
 applyPageTheme();
 updateText();
 updateUI();
 beep(440,.12,.65);
 setTimeout(()=>beep(660,.14,.72),120);
}

const creditEl=document.getElementById('credit');
if(creditEl){
 creditEl.style.cursor='default';
 creditEl.addEventListener('click',()=>{
   unlockGermanScheme();
   trasselTapCount++;
   clearTimeout(trasselTapTimer);
   trasselTapTimer=setTimeout(()=>{trasselTapCount=0;},900);
   if(trasselTapCount>=3){
     if(centerSymbol!=='spiral'){
       centerSymbol='spiral';
     } else if(!spiralSpin){
       spiralSpin=true;
     }
     trasselTapCount=0;
     clearTimeout(trasselTapTimer);
   }
 });
}


function triggerCenterSecret(){
 centerTapCount++;
 clearTimeout(centerTapTimer);
 centerTapTimer=setTimeout(()=>{centerTapCount=0;},1200);
 if(centerTapCount>=6){
   boardRainbow=true;
   centerTapCount=0;
   clearTimeout(centerTapTimer);
 }
}

['pointerdown','touchstart','mousedown','keydown'].forEach(ev=>{
 window.addEventListener(ev, unlockAudio, {passive:true});
});


document.querySelectorAll('button,select,label.toggle').forEach(el=>{
 el.addEventListener('mouseenter',()=>{ el.style.background=scheme().controlHover; });
 el.addEventListener('mouseleave',()=>{ el.style.background=scheme().controlBg; });
});

syncControls(); resetGame(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
