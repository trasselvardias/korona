<html lang="en">
<head>

<style>
  :root{--bg:#1f201c;--panel:#2c2a24;--ink:#f6edda;--muted:#c9bfa9;--wood:#b67b42;--darkwood:#6f4326;--line:#efe4c6;--red:#cf4f61;--blue:#5185d9;--green:#55a868;--yellow:#d8b34c;}
  *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#38352c,#171713 70%);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
  header{padding:14px 18px;border-bottom:1px solid #ffffff18;background:#181812d9;backdrop-filter:blur(6px);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:22px;margin:0;letter-spacing:.2px} .tag{color:var(--muted)}
  main{display:grid;grid-template-columns:minmax(320px,1fr) 380px;gap:16px;max-width:1240px;margin:0 auto;padding:16px}
  #wrap{display:grid;place-items:center}.boardShell{width:min(92vw,760px);aspect-ratio:1;padding:18px;border-radius:24px;background:linear-gradient(145deg,#7b4a28,#c38a4e 45%,#6d3e23);box-shadow:0 24px 60px #0009,inset 0 0 0 5px #432616,inset 0 0 18px #fff2;}

  .status{padding:12px;border:1px solid #ffffff21;border-radius:14px;background:#00000025;margin-bottom:12px}.turn{font-size:19px;font-weight:700}.pill{display:inline-block;padding:2px 8px;border-radius:999px;margin-left:6px;color:#fff;text-shadow:0 1px 2px #0008}.red{background:var(--red)}.blue{background:var(--blue)}.green{background:var(--green)}.yellow{background:var(--yellow);color:#2b2110;text-shadow:none}
  .score{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.score div{border-radius:12px;background:#0003;padding:10px}.big{font-size:24px;font-weight:800}
  button,select,label.toggle{appearance:none;border:1px solid #ffffff25;background:#3a3529;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;cursor:pointer}button:hover,select:hover,label.toggle:hover{background:#494232}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.botGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.botGrid label{font-size:12px;color:var(--muted);display:grid;gap:4px}.small{font-size:12px;color:var(--muted)}
  details{border-top:1px solid #ffffff1a;margin-top:12px;padding-top:10px}summary{cursor:pointer;font-weight:800}ul{padding-left:18px}kbd{background:#111;border:1px solid #555;border-radius:5px;padding:1px 5px}.log{height:148px;overflow:auto;background:#11100c;border-radius:12px;padding:10px;color:#e9ddc2;font-size:13px}.log p{margin:0 0 7px}
  @media (max-width:920px){main{grid-template-columns:1fr}aside{position:static}.boardShell{width:min(95vw,720px)}}

<header><h1>Korona</h1><span class="tag" id="tagline"></span></header>
<main>
  <div id="wrap"><div class="boardShell"><canvas id="game" width="900" height="900" aria-label="Korona board"></canvas></div></div>
  <aside>

    </div>

    <details><summary id="logSummary"></summary><div class="log" id="log"></div></details>

</main>
<script>
(() => {
'use strict';
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const W=900,H=900, rail=42, minX=rail, maxX=W-rail, minY=rail, maxY=H-rail;
const pockets=[{x:70,y:70},{x:830,y:70},{x:70,y:830},{x:830,y:830}], pocketR=45;
const discR=22, strikerR=28;
// Fixed-step physics makes gameplay independent of display refresh rate.
// These values are applied once per 60 Hz simulation step.
const PHYSICS_DT_MS=1000/60, MAX_PHYSICS_STEPS=6;
const FRICTION=0.976, STOP_EPS=0.055, MOVING_EPS=0.09;
const colors={red:'#cf4f61',blue:'#5185d9',green:'#55a868',yellow:'#d8b34c',striker:'#efe3c6'};
const playerDefs={
  red:{side:'top',shoot:'bottom'},
  blue:{side:'bottom',shoot:'top'},
  green:{side:'left',shoot:'right'},
  yellow:{side:'right',shoot:'left'}
};
const playerOrders={2:['red','blue'],3:['red','blue','green'],4:['red','blue','green','yellow']};
const T={
  en:{
    tagline:'Finnish board billiards — local 2–4 player browser version', turn:'Turn', help:'Place the striker on your shooting line, pull back, release.', wait:'Wait for all discs to stop.', over:'Game over. Start a new game to play again.', newGame:'New game', undo:'Undo shot', apply:'Apply', aim:'Aim helper', sound:'Sound', off:'off', on:'on', controls:'Controls: drag the large striker (“plutsi/limppu”). The arrow shows shot direction and power. Use R to cancel a loaded shot before shooting.', rules:'Implemented rules', log:'Shot log', players:['Red','Blue','Green','Yellow'], rowSetup:'Finnish row setup', centerSetup:'Center-circle Couronne setup', newLog:'New game', own:'own', opponents:'opponent', nothing:'nothing potted', strikerFoul:'striker foul', returned:'one own disc returned', wins:'wins!', draw:'Draw', shot:'shot', potted:'potted', foulMix:'potted own and opponent discs', multiplayerNote:'For 3–4 players, each color has 8 discs and shoots from the side opposite its starting row.', human:'Human', computer:'Computer', easyAI:'Easy AI', hardAI:'Hard AI', impossibleAI:'Impossible AI', inactive:'Inactive', botPlayers:'Computer players', botThinking:'Computer is aiming…', botShot:'Computer shot', credit:'Game by Trassel Vardias'
  },
  fi:{
    tagline:'Suomalainen lautabiljardi — paikallinen 2–4 pelaajan selainversio', turn:'Vuoro', help:'Aseta plutsi lyöntilinjalle, vedä taakse ja päästä irti.', wait:'Odota, että kaikki nappulat pysähtyvät.', over:'Peli päättyi. Aloita uusi peli.', newGame:'Uusi peli', undo:'Kumoa lyönti', apply:'Käytä', aim:'Tähtäysapu', sound:'Äänet', off:'pois', on:'päällä', controls:'Ohjaus: vedä suurta lyöntinappulaa (“plutsi/limppu”). Nuoli näyttää suunnan ja voiman. R-näppäin peruu viritetyn lyönnin ennen laukaisua.', rules:'Toteutetut säännöt', log:'Lyöntiloki', players:['Punainen','Sininen','Vihreä','Keltainen'], rowSetup:'Suomalainen riviasettelu', centerSetup:'Keskirinki / Couronne -asettelu', newLog:'Uusi peli', own:'omaa', opponents:'vastustajan', nothing:'ei pussiin menneitä', strikerFoul:'plutsi meni pussiin', returned:'yksi oma nappula palautettiin', wins:'voittaa!', draw:'Tasapeli', shot:'löi', potted:'pussiin', foulMix:'oma ja vastustajan nappula meni pussiin', multiplayerNote:'3–4 pelaajan pelissä jokaisella värillä on 8 nappulaa ja lyönti tapahtuu oman aloitusrivin vastakkaiselta sivulta.', human:'Ihminen', computer:'Tietokone', easyAI:'Helppo AI', hardAI:'Vaikea AI', impossibleAI:'Mahdoton AI', inactive:'Ei käytössä', botPlayers:'Tietokonepelaajat', botThinking:'Tietokone tähtää…', botShot:'Tietokoneen lyönti', credit:'Peli: Trassel Vardias'
  },
  sv:{
    tagline:'Finsk brädbiljard — lokal webbläsarversion för 2–4 spelare', turn:'Tur', help:'Placera köbrickan på din slaglinje, dra bakåt och släpp.', wait:'Vänta tills alla brickor har stannat.', over:'Spelet är slut. Starta ett nytt spel.', newGame:'Nytt spel', undo:'Ångra slag', apply:'Använd', aim:'Sikthjälp', sound:'Ljud', off:'av', on:'på', controls:'Kontroller: dra den stora köbrickan (“plutsi/limppu”). Pilen visar riktning och kraft. Tryck R för att avbryta ett laddat slag före skottet.', rules:'Implementerade regler', log:'Slaglogg', players:['Röd','Blå','Grön','Gul'], rowSetup:'Finsk raduppställning', centerSetup:'Centercirkel / Couronne', newLog:'Nytt spel', own:'egna', opponents:'motståndares', nothing:'inget i hål', strikerFoul:'köbrickan i hål', returned:'en egen bricka återställdes', wins:'vinner!', draw:'Oavgjort', shot:'slag', potted:'i hål', foulMix:'egna och motståndares brickor i hål', multiplayerNote:'I 3–4-spelarläget har varje färg 8 brickor och slår från sidan mittemot sin startrad.', human:'Människa', computer:'Dator', easyAI:'Lätt AI', hardAI:'Svår AI', impossibleAI:'Omöjlig AI', inactive:'Inaktiv', botPlayers:'Datorspelare', botThinking:'Datorn siktar…', botShot:'Datorslag', credit:'Spel av Trassel Vardias'
  }
};
let lang='en', variant='rows', playerCount=2, players=playerOrders[2], current='red', bodies=[], striker=null, dragging=false, dragFrom=null, dragNow=null, moving=false, won=false, aimHelper=false, sound=false;
let aiMode={red:'human',blue:'easy',green:'human',yellow:'human'}, botPending=false;
let centerSymbol='joulutorttu', trasselTapCount=0, trasselTapTimer=null, spiralSpin=false, spiralAngle=0;
let lastSnapshot=null, shotEvents=null, lastFrameTime=null, physicsAccumulator=0;
const turnText=document.getElementById('turnText'), help=document.getElementById('help'), scoreBox=document.getElementById('scoreBox'), logEl=document.getElementById('log'), winText=document.getElementById('winText');
function tr(){return T[lang]||T.en} function capColor(c){return tr().players[['red','blue','green','yellow'].indexOf(c)]||c}
function cloneState(){return JSON.stringify({variant,playerCount,players,current,bodies,striker,won,lang,aiMode});}
function restoreState(s){
 if(!s)return;
 lastFrameTime=null; physicsAccumulator=0;
 const o=JSON.parse(s);
 variant=o.variant; playerCount=o.playerCount||2; players=o.players||playerOrders[playerCount];
 current=o.current; bodies=o.bodies; striker=o.striker; won=o.won; lang=o.lang||lang;
 if(o.aiMode) aiMode=o.aiMode;
 else if(o.botMode) aiMode={red:o.botMode.red?'easy':'human',blue:o.botMode.blue?'easy':'human',green:o.botMode.green?'easy':'human',yellow:o.botMode.yellow?'easy':'human'};
 botPending=false;
 syncControls(); updateText(); updateUI();
}
function log(msg){const p=document.createElement('p'); p.textContent=msg; logEl.prepend(p);}
function beep(freq=360,dur=.04){ if(!sound) return; try{const ac=new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=freq; g.gain.value=.04; o.connect(g); g.connect(ac.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime+dur); o.stop(ac.currentTime+dur);}catch(e){} }
function sidePositions(side){ const gap=discR*2+5; const start=W/2-gap*3.5; const fixed={top:minY+discR+5,bottom:maxY-discR-5,left:minX+discR+5,right:maxX-discR-5}[side]; return Array.from({length:8},(_,i)=> side==='top'||side==='bottom' ? {x:start+i*gap,y:fixed} : {x:fixed,y:start+i*gap}); }

function centerPatternPositions(count){
 const layouts={
   2:[3,5,5,3],
   3:[5,7,7,5],
   4:[5,7,8,7,5]
 };
 const rows=layouts[count]||layouts[2];
 const gap=discR*2.18, yGap=gap*.88;
 const total=rows.reduce((a,b)=>a+b,0);
 const pts=[];
 const y0=H/2-yGap*(rows.length-1)/2;
 rows.forEach((n,row)=>{
   const x0=W/2-gap*(n-1)/2;
   const y=y0+row*yGap;
   for(let i=0;i<n;i++) pts.push({x:x0+i*gap,y});
 });
 // Safety: the layout must produce exactly 8 discs per active player.
 if(total!==count*8) console.warn('Center pattern count mismatch', count, total);
 return pts;
}

function shootPoint(player){ const s=playerDefs[player].shoot; const pad=92; return {top:{x:W/2,y:minY+pad},bottom:{x:W/2,y:maxY-pad},left:{x:minX+pad,y:H/2},right:{x:maxX-pad,y:H/2}}[s]; }
function shootingLine(player){ const s=playerDefs[player].shoot, pad=92; if(s==='top'||s==='bottom') return {axis:'y', value:s==='top'?minY+pad:maxY-pad, from:minX+90, to:maxX-90}; return {axis:'x', value:s==='left'?minX+pad:maxX-pad, from:minY+90, to:maxY-90}; }
function placeFreeNear(x,y,r=discR){ const all=()=>bodies.concat(striker?[striker]:[]); for(let ring=0; ring<20; ring++){ const n=Math.max(8,ring*8); for(let a=0; a<n; a++){ let ang=a/n*Math.PI*2, nx=x+Math.cos(ang)*ring*(r*1.15), ny=y+Math.sin(ang)*ring*(r*1.15); if(nx<minX+r||nx>maxX-r||ny<minY+r||ny>maxY-r) continue; if(!all().some(b=>!b.pocketed && dist(nx,ny,b.x,b.y)<r+b.r+2)) return {x:nx,y:ny}; }} return {x:W/2,y:H/2};}
function body(id,color,x,y,r=discR){return {id,color,x,y,vx:0,vy:0,r,m:r*r,pocketed:false,startX:x,startY:y};}
function resetGame(){ lastFrameTime=null; physicsAccumulator=0; dragging=false; dragFrom=null; dragNow=null; players=playerOrders[playerCount]; current=players[0]; bodies=[]; won=false; botPending=false; logEl.innerHTML=''; winText.textContent=''; let id=0; if(variant==='rows'){ for(const pl of players){ for(const p of sidePositions(playerDefs[pl].side)) bodies.push(body(id++,pl,p.x,p.y)); } }
else { const pts=centerPatternPositions(players.length); pts.forEach((p,i)=>bodies.push(body(id++,players[i%players.length],p.x,p.y))); }
 resetStriker(null,true); lastSnapshot=null; log(`${tr().newLog}: ${variant==='rows'?tr().rowSetup:tr().centerSetup}, ${playerCount} players.`); updateText(); updateUI();}
function active(){return bodies.filter(b=>!b.pocketed).concat(striker && !striker.pocketed ? [striker] : []);} function dist(a,b,c,d){return Math.hypot(a-c,b-d);} function speed(b){return Math.hypot(b.vx,b.vy);}
function isSafeStrikerPos(x,y){ if(y<minY+strikerR||y>maxY-strikerR||x<minX+strikerR||x>maxX-strikerR) return false; if(pockets.some(p=>dist(x,y,p.x,p.y)<pocketR+strikerR*.8)) return false; return !bodies.some(b=>!b.pocketed && dist(x,y,b.x,b.y)<b.r+strikerR+2); }
function resetStriker(preferred,quiet=false){
 const sp=shootPoint(current);
 let x=sp.x,y=sp.y;
 const line=shootingLine(current);
 if(preferred!=null){
   if(line.axis==='y') x=Math.max(minX+strikerR+45,Math.min(maxX-strikerR-45,preferred));
   else y=Math.max(minY+strikerR+45,Math.min(maxY-strikerR-45,preferred));
 }
 // We are replacing the striker, so do not let placeFreeNear avoid the old striker.
 // This prevents New Game / Apply from alternating between two nearby start positions.
 striker=null;
 let pos=placeFreeNear(x,y,strikerR);
 striker=body('s','striker',pos.x,pos.y,strikerR);
 striker.isStriker=true;
 if(!quiet) updateUI();
}
function nextPlayer(){ const i=players.indexOf(current); current=players[(i+1)%players.length]; }
function updatePhysics(){ let arr=active(); for(const b of arr){ b.x+=b.vx; b.y+=b.vy; b.vx*=FRICTION; b.vy*=FRICTION; if(Math.abs(b.vx)<STOP_EPS) b.vx=0; if(Math.abs(b.vy)<STOP_EPS) b.vy=0; if(b.x-b.r<minX){b.x=minX+b.r;b.vx=Math.abs(b.vx)*.82;beep(160)} if(b.x+b.r>maxX){b.x=maxX-b.r;b.vx=-Math.abs(b.vx)*.82;beep(160)} if(b.y-b.r<minY){b.y=minY+b.r;b.vy=Math.abs(b.vy)*.82;beep(160)} if(b.y+b.r>maxY){b.y=maxY-b.r;b.vy=-Math.abs(b.vy)*.82;beep(160)} }
 for(let k=0;k<2;k++) for(let i=0;i<arr.length;i++) for(let j=i+1;j<arr.length;j++) collide(arr[i],arr[j]);
 for(const b of arr){ for(const p of pockets){ if(dist(b.x,b.y,p.x,p.y)<pocketR-b.r*.25){ b.pocketed=true; b.vx=b.vy=0; if(b.isStriker) shotEvents.strikerPocket=true; else shotEvents.potted.push(b); beep(680,.08); break; } } }
 moving=active().some(b=>speed(b)>MOVING_EPS); if(!moving && shotEvents) finishShot();}
function collide(a,b){ const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), min=a.r+b.r; if(d<=0||d>=min) return; const nx=dx/d, ny=dy/d, overlap=min-d; a.x-=nx*overlap*(b.m/(a.m+b.m)); a.y-=ny*overlap*(b.m/(a.m+b.m)); b.x+=nx*overlap*(a.m/(a.m+b.m)); b.y+=ny*overlap*(a.m/(a.m+b.m)); const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vel=rvx*nx+rvy*ny; if(vel>0) return; const e=.93, j=-(1+e)*vel/(1/a.m+1/b.m), ix=j*nx, iy=j*ny; a.vx-=ix/a.m; a.vy-=iy/a.m; b.vx+=ix/b.m; b.vy+=iy/b.m; beep(240+Math.min(600,Math.abs(j)*.04),.025);}
function returnOne(player){ const candidates=bodies.filter(b=>b.color===player && b.pocketed); if(!candidates.length) return false; const b=candidates[candidates.length-1]; b.pocketed=false; const pos=variant==='rows'?placeFreeNear(b.startX,b.startY,b.r):placeFreeNear(W/2,H/2,b.r); b.x=pos.x; b.y=pos.y; b.vx=b.vy=0; return true;}
function finishShot(){ const shooter=current; const own=shotEvents.potted.filter(b=>b.color===shooter).length; const opp=shotEvents.potted.length-own; const foul=shotEvents.strikerPocket || (own>0 && opp>0); let parts=[]; if(own||opp) parts.push(`${own} ${tr().own}, ${opp} ${tr().opponents} ${tr().potted}`); else parts.push(tr().nothing); if(shotEvents.strikerPocket) parts.push(tr().strikerFoul); if(own>0 && opp>0) parts.push(tr().foulMix); if(foul){ if(returnOne(shooter)) parts.push(tr().returned); nextPlayer(); } else if(opp>0 && own===0){ nextPlayer(); } else if(own>0){ /* keeps turn */ } else nextPlayer(); log(`${capColor(shooter)} ${tr().shot}: ${parts.join(' — ')}.`); shotEvents=null; botPending=false; const l=shootingLine(current); resetStriker(l.axis==='y' ? striker?.x : striker?.y); checkWin(); updateUI();}
function checkWin(){ const winners=players.filter(pl=>!bodies.some(b=>b.color===pl&&!b.pocketed)); if(winners.length){ won=true; const text=winners.length>1?tr().draw:`${capColor(winners[0])} ${tr().wins}`; winText.textContent=text; help.textContent=tr().over; log(`${tr().over} ${text}`); }}
function updateBotControls(){
 const box=document.getElementById('botControls');
 const order=['red','blue','green','yellow'];
 box.innerHTML=`<div style="grid-column:1/-1;font-weight:800;color:var(--ink)">${tr().botPlayers}</div>`+
 order.map(pl=>{
   const active=players.includes(pl);
   const dis=active?'':'disabled';
   return `<label><span><span class="pill ${pl}">${capColor(pl)}</span></span><select data-ai="${pl}" ${dis}><option value="human">${active?tr().human:tr().inactive}</option><option value="easy">${tr().easyAI}</option><option value="hard">${tr().hardAI}</option><option value="impossible">${tr().impossibleAI}</option></select></label>`;
 }).join('');
 box.querySelectorAll('select[data-ai]').forEach(sel=>{
   const pl=sel.dataset.ai;
   sel.value=players.includes(pl)?(aiMode[pl]||'human'):'human';
   sel.onchange=e=>{ aiMode[pl]=e.target.value; botPending=false; };
 });

function impossibleAiCandidates(limit=38){

   for(const p of pockets){
     const tvx=t.x-p.x, tvy=t.y-p.y, len=Math.hypot(tvx,tvy)||1;
     const ux=tvx/len, uy=tvy/len;
     const ghost={x:t.x+ux*(t.r+strikerR+2), y:t.y+uy*(t.r+strikerR+2)};
     const idealKey=line.axis==='y'?ghost.x:ghost.y;
     const targetClear=clearLine(t.x,t.y,p.x,p.y,t.r);
     for(const off of offsets){
       const key=clamp(idealKey+off,line.from,line.to);
       const start=pointForLine(line,key);
       if(!isSafeStrikerPos(start.x,start.y)) continue;
       const strikerClear=clearShotLine(start.x,start.y,ghost.x,ghost.y,[t.id]);
       const d1=dist(start.x,start.y,ghost.x,ghost.y), d2=dist(t.x,t.y,p.x,p.y);

   // This adds forceful useful shots when exact ghost-ball geometry is blocked.
   const nearest=pockets.map(p=>({p,d:dist(t.x,t.y,p.x,p.y)})).sort((a,b)=>a.d-b.d)[0].p;
   const key=line.axis==='y'?clamp(t.x,line.from,line.to):clamp(t.y,line.from,line.to);
   for(const keyOff of [-45,-20,0,20,45]){
     const start=pointForLine(line,clamp(key+keyOff,line.from,line.to));
     if(!isSafeStrikerPos(start.x,start.y)) continue;
     const aim={x:t.x+(t.x-nearest.x)*0.10,y:t.y+(t.y-nearest.y)*0.10};

   }

 if(!cands.length) return baseAiCandidates(limit);

function cloneForAi(){

function simDist(a,b,c,d){return Math.hypot(a-c,b-d);}
function simPointLine(px,py,x1,y1,x2,y2){ const A=px-x1,B=py-y1,C=x2-x1,D=y2-y1,dot=A*C+B*D,len=C*C+D*D||1,t=Math.max(0,Math.min(1,dot/len)); return simDist(px,py,x1+C*t,y1+D*t); }

 if(d<=0||d>=min) return;
 const nx=dx/d, ny=dy/d, overlap=min-d;
 a.x-=nx*overlap*(b.m/(a.m+b.m)); a.y-=ny*overlap*(b.m/(a.m+b.m));
 b.x+=nx*overlap*(a.m/(a.m+b.m)); b.y+=ny*overlap*(a.m/(a.m+b.m));
 const rvx=b.vx-a.vx, rvy=b.vy-a.vy, vel=rvx*nx+rvy*ny;
 if(vel>0) return;
 const e=.93, j=-(1+e)*vel/(1/a.m+1/b.m), ix=j*nx, iy=j*ny;

}

 const dx=cand.aim.x-cand.start.x, dy=cand.aim.y-cand.start.y, d=Math.hypot(dx,dy)||1;
 s.vx=dx/d*power; s.vy=dy/d*power;
 let active=arr.concat([s]), own=0, opp=0, strikerPocket=false, steps=0;
 for(;steps<520;steps++){
   let any=false;
   for(const b of active){
     if(b.pocketed) continue;
     b.x+=b.vx; b.y+=b.vy; b.vx*=FRICTION; b.vy*=FRICTION;
     if(Math.abs(b.vx)<STOP_EPS) b.vx=0; if(Math.abs(b.vy)<STOP_EPS) b.vy=0;
     if(b.x-b.r<minX){b.x=minX+b.r;b.vx=Math.abs(b.vx)*.82}
     if(b.x+b.r>maxX){b.x=maxX-b.r;b.vx=-Math.abs(b.vx)*.82}
     if(b.y-b.r<minY){b.y=minY+b.r;b.vy=Math.abs(b.vy)*.82}
     if(b.y+b.r>maxY){b.y=maxY-b.r;b.vy=-Math.abs(b.vy)*.82}
   }
   for(let k=0;k<2;k++) for(let i=0;i<active.length;i++) for(let j=i+1;j<active.length;j++){
     if(!active[i].pocketed&&!active[j].pocketed) simCollide(active[i],active[j]);
   }
   for(const b of active){
     if(b.pocketed) continue;
     for(const p of pockets){
       if(simDist(b.x,b.y,p.x,p.y)<pocketR-b.r*.25){
         b.pocketed=true; b.vx=b.vy=0;

   }
   if(!any) break;
 }
 // Reward clean own pockets strongly, punish fouls and helping opponents.
 // The higher own-disc reward makes stronger shots worthwhile instead of timid.
 let score=own*8500-opp*3200-steps*.35;
 if(own>=2) score+=own*3500;
 if(strikerPocket) score-=9000;
 if(own>0&&opp>0) score-=5200;
 if(own===0&&opp===0&&cand.target){
   // Positional fallback: prefer moving an own disc closer to a pocket.
   const after=active.find(b=>b.id===cand.target.id);
   if(after&&!after.pocketed){
     const beforeBest=Math.min(...pockets.map(p=>simDist(cand.target.x,cand.target.y,p.x,p.y)));
     const afterBest=Math.min(...pockets.map(p=>simDist(after.x,after.y,p.x,p.y)));

   const power=basePower*powerMult;
   const sim=simulateAiShot({...cand,aim},power);
   let score=sim.score+cand.base*.16;
   if(cand.type==='direct' && sim.own>0 && sim.opp===0 && !sim.strikerPocket) score += 6500 + sim.own*2300;
   if(cand.type==='force' && sim.own===0 && !sim.strikerPocket) score += 650;
   if(sim.own>=2 && sim.opp===0 && !sim.strikerPocket) score += 5200;
   if(sim.own>0 && sim.opp===0 && !sim.strikerPocket) score += 1800; // extra value for keeping turn
   if(sim.strikerPocket || (sim.own>0&&sim.opp>0)) score -= 12500;
   tested++;
   return {start:cand.start,aim,power,score,sim,wobble:0,tested};
 }

 for(const cand of candidates){
   for(const pm of coarsePowers){
     for(const ao of coarseAim){
       scored.push(testShot(cand,pm,ao));
     }
   }
 }
 scored.sort((a,b)=>b.score-a.score);

 const refinePowers=[0.94,1.00,1.06,1.14,1.24,1.36,1.50];
 const refineAim=[0,-0.012,0.012,-0.026,0.026,-0.040,0.040];
 let best=scored[0]||null;
 const refineSeeds=scored.slice(0,8);
 for(const seed of refineSeeds){
   const cand={start:seed.start,aim:seed.aim,base:seed.score*.025,type:'refine'};
   for(const pm of refinePowers){
     for(const ao of refineAim){
       const trial=testShot(cand,pm,ao);
       if(!best||trial.score>best.score) best=trial;
     }
   }
 }
 if(best) return best;
 return botChooseShotHard();
}

function botChooseShot(){ return aiMode[current]==='impossible'?botChooseShotImpossible():(aiMode[current]==='hard'?botChooseShotHard():botChooseShotEasy()); }
function botShoot(){
 if(moving||won||!isComputerTurn()||shotEvents) return;
 const shot=botChooseShot();
 const start=placeFreeNear(shot.start.x,shot.start.y,strikerR);
 striker.x=start.x; striker.y=start.y;
 const dx=shot.aim.x-start.x, dy=shot.aim.y-start.y, d=Math.hypot(dx,dy)||1;
 const wobble=shot.wobble||0;
 const ca=Math.cos(wobble), sa=Math.sin(wobble);
 const ux=(dx/d)*ca-(dy/d)*sa, uy=(dx/d)*sa+(dy/d)*ca;
 lastSnapshot=cloneState(); shotEvents={potted:[],strikerPocket:false};
 striker.vx=ux*shot.power; striker.vy=uy*shot.power;
 physicsAccumulator=0; lastFrameTime=null; moving=true;
 log(`${tr().botShot}: ${capColor(current)} (${aiLabel(current)}).`);
}
function maybeAutoBot(){ if(botPending||moving||won||shotEvents||!isComputerTurn()) return; botPending=true; setTimeout(()=>{ botPending=false; botShoot(); }, aiMode[current]==='impossible'?250:(aiMode[current]==='hard'?450:650)); }
function loop(now){
 if(lastFrameTime==null) lastFrameTime=now;
 const elapsed=Math.min(100, now-lastFrameTime);
 lastFrameTime=now;
 if(moving){
   physicsAccumulator += elapsed;
   let steps=0;
   while(physicsAccumulator>=PHYSICS_DT_MS && moving && steps<MAX_PHYSICS_STEPS){
     updatePhysics();
     physicsAccumulator -= PHYSICS_DT_MS;
     steps++;
   }
   if(steps>=MAX_PHYSICS_STEPS) physicsAccumulator=0;
 } else {
   physicsAccumulator=0;
   maybeAutoBot();
 }
 if(spiralSpin && centerSymbol==='spiral') spiralAngle -= elapsed * 0.0012;
 updateUI();
 draw();
 requestAnimationFrame(loop);
}
function pos(e){ const rect=canvas.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:(t.clientX-rect.left)*W/rect.width,y:(t.clientY-rect.top)*H/rect.height};}
function linePlacement(p){ const l=shootingLine(current); if(l.axis==='y') return {ok:Math.abs(p.y-l.value)<55,x:p.x,y:l.value,key:p.x}; return {ok:Math.abs(p.x-l.value)<55,x:l.value,y:p.y,key:p.y};}
canvas.addEventListener('pointerdown',e=>{ if(moving||won||isComputerTurn())return; const p=pos(e); if(striker&&dist(p.x,p.y,striker.x,striker.y)<striker.r+12){ dragging=true; dragFrom={x:striker.x,y:striker.y}; dragNow=p; canvas.setPointerCapture(e.pointerId); } else { const lp=linePlacement(p); if(lp.ok && isSafeStrikerPos(lp.x,lp.y)){ striker.x=lp.x; striker.y=lp.y; } } });
canvas.addEventListener('pointermove',e=>{ if(dragging) dragNow=pos(e); });
canvas.addEventListener('pointerup',e=>{ if(!dragging||moving||won||isComputerTurn())return; const p=pos(e); dragging=false; const vx=(dragFrom.x-p.x), vy=(dragFrom.y-p.y), power=Math.min(165,Math.hypot(vx,vy)); if(power<8) return; lastSnapshot=cloneState(); shotEvents={potted:[],strikerPocket:false}; striker.vx=vx*.125; striker.vy=vy*.125; physicsAccumulator=0; lastFrameTime=null; moving=true; });
window.addEventListener('keydown',e=>{
 if(e.key.toLowerCase()==='r'&&!moving&&!won&&!isComputerTurn()){
   // Cancel only the loaded/pulled strike. Keep the striker exactly where it is.
   dragging=false;
   dragFrom=null;
   dragNow=null;
   if(striker){ striker.vx=0; striker.vy=0; }
 }
});
function syncControls(){ document.getElementById('variant').value=variant; document.getElementById('players').value=String(playerCount); document.getElementById('language').value=lang;}
document.getElementById('newBtn').onclick=resetGame; document.getElementById('undoBtn').onclick=()=>{restoreState(lastSnapshot); lastSnapshot=null; log(lang==='fi'?'Lyönti kumottu.':lang==='sv'?'Slaget ångrades.':'Undid last shot.');};
document.getElementById('applyVariant').onclick=()=>{variant=document.getElementById('variant').value; playerCount=Number(document.getElementById('players').value); resetGame();};
document.getElementById('language').onchange=e=>{lang=e.target.value; syncControls(); updateText();};
document.getElementById('players').onchange=e=>{playerCount=Number(e.target.value); players=playerOrders[playerCount]; botPending=false; updateText();};
document.getElementById('variant').onchange=e=>{variant=e.target.value;};
document.getElementById('botBtn').onclick=()=>{aimHelper=!aimHelper; updateText();};
document.getElementById('soundBtn').onclick=()=>{sound=!sound; updateText();};

const creditEl=document.getElementById('credit');
if(creditEl){
 creditEl.style.cursor='default';
 creditEl.addEventListener('click',()=>{
   trasselTapCount++;
   clearTimeout(trasselTapTimer);
   trasselTapTimer=setTimeout(()=>{trasselTapCount=0;},900);
   if(trasselTapCount>=3){
     if(centerSymbol!=='spiral'){
       centerSymbol='spiral';
     } else if(!spiralSpin){
       spiralSpin=true;
     }
     trasselTapCount=0;
     clearTimeout(trasselTapTimer);
   }
 });
}

syncControls(); resetGame(); requestAnimationFrame(loop);
})();
</script>
